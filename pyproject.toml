[project]
name = "pykma"
version = "0.1.0"
description = "기상청 단기예보 API Python SDK — 위경도만 넣으면 된다 / Python SDK for the Korea Meteorological Administration short-term forecast API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "alton15" }]
keywords = ["기상청", "날씨", "weather", "korea", "kma", "forecast", "공공데이터"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Korean",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# MCP SDK 2.0에서 FastMCP가 MCPServer로 바뀌었다. 1.x로는 동작하지 않는다.
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://github.com/alton15/pykma"
Issues = "https://github.com/alton15/pykma/issues"

[project.scripts]
pykma-mcp = "pykma_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykma", "src/pykma_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 테스트 이름은 한국어로 쓴다. 무엇이 깨졌는지 실패 출력에서 바로 읽히는 쪽이
# 낫고, pep8-naming은 비ASCII 식별자를 "소문자가 아니다"로 본다.
"tests/**" = ["N802"]

[tool.pytest.ini_options]
addopts = "--cov=pykma --cov=pykma_mcp --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]
